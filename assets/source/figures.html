<!-- problem: default installer versus a Homeware guide -->
<div class="item" id="problem" style="height:440px">
  <svg viewBox="0 0 1200 440" fill="none" stroke="var(--line)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <defs>
      <g id="lock"><rect x="-13" y="-4" width="26" height="22" rx="2" fill="var(--accent)" stroke="none"/><path d="M-8 -4 v-8 a8 8 0 0 1 16 0 v8" stroke="var(--accent)" stroke-width="3.2"/></g>
      <g id="i-uac"><path d="M22 4 L38 10 V22 C38 32 30 38 22 42 C14 38 6 32 6 22 V10Z"/><path d="M22 14 V25 M22 31 V32" stroke="var(--accent)" stroke-width="3.2"/></g>

      <g id="i-check"><circle cx="22" cy="22" r="17"/><path d="M13 22 l7 7 12 -14" stroke="var(--accent)" stroke-width="3"/></g>
      <g id="i-home"><path d="M6 22 L22 8 L38 22 M10 20 V38 H34 V20"/><path d="M19 38 V28 H25 V38" stroke="var(--accent)"/></g>
    </defs>
    <text x="48" y="58" font-family="DM Serif Display" font-size="34" fill="var(--ink)" stroke="none">The default installer</text>
    <text x="48" y="86" font-family="IBM Plex Mono" font-size="17" fill="var(--muted)" stroke="none">machine scope, asks for admin</text>
    <text x="632" y="58" font-family="DM Serif Display" font-size="34" fill="var(--ink)" stroke="none">A Homeware guide</text>
    <text x="632" y="86" font-family="IBM Plex Mono" font-size="17" fill="var(--muted)" stroke="none">user scope, standard user</text>
    <rect x="48" y="100" width="520" height="300" rx="6" fill="var(--soft)"/>
    <rect x="632" y="100" width="520" height="300" rx="6" fill="var(--paper)" stroke="var(--accent)" stroke-width="4"/>
    <path d="M582 238 L604 250 L582 262" stroke="var(--accent)" stroke-width="4"/>
    <use href="#i-uac" x="72" y="138"/><use href="#i-folder" x="72" y="228"/><use href="#lock" x="94" y="326"/>
    <g font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="var(--ink)" stroke="none">
      <text x="136" y="167">Raises a UAC prompt</text>
      <text x="136" y="257">Writes to C:\Program Files</text>
      <text x="136" y="338">A standard user cannot</text>
      <text x="136" y="362">approve it</text>
    </g>
    <use href="#i-check" x="656" y="138"/><use href="#i-folder" x="656" y="218"/><use href="#i-home" x="656" y="308"/>
    <g font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="var(--ink)" stroke="none">
      <text x="720" y="167">No UAC prompt</text>
      <text x="720" y="236">Nothing written to C:\Program Files,</text>
      <text x="720" y="260">C:\Windows or HKEY_LOCAL_MACHINE</text>
      <text x="720" y="326">Everything lives in the user profile</text>
    </g>
    <text x="720" y="352" font-family="IBM Plex Mono" font-size="17" fill="var(--muted)" stroke="none">%LOCALAPPDATA%\Programs\&lt;App&gt;</text>
  </svg>
</div>

<!-- integrate: the integration steps of the README code block -->
