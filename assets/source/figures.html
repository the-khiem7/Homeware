<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homeware figures</title>
<!-- Source of ../readme/problem.webp, guide.webp, integrate.webp, contribute.webp and their -dark twins. Render from the repo root with:
     uvx --from playwright --with pillow python -I <skill-dir>/scripts/render.py assets/source/figures.html --root assets --out assets/readme
     Signature: see hero.html (toy bricks, sky-blue ground, Syne and DM Mono). Cards, steps and bullets are bricks with studs; mini scenes reuse the hero's building and baseplate.
     Every label comes from the README, CONTRIBUTING.md, the guide template or the Layout table of AGENTS.md. No figure names a guide. -->
<script src="shared.js"></script>
<script src="bricks.js"></script>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="sheet">
<div class="item" id="problem" style="height:540px"><svg viewBox="0 0 1200 540" id="g-problem"></svg></div>
<div class="item" id="guide" style="height:510px"><svg viewBox="0 0 1200 510" id="g-guide"></svg></div>
<div class="item" id="integrate" style="height:520px"><svg viewBox="0 0 1200 520" id="g-integrate"></svg></div>
<div class="item" id="contribute" style="height:620px"><svg viewBox="0 0 1200 620" id="g-contribute"></svg></div>
</div>
<script>
var ON = 'fill="' + ONBRICK + '"';
var tx = function (x, y, s, size, w) { return T(x, y, s, size, { fill: ONBRICK, w: w || 500 }); };

/* problem: the default installer meets a locked building; a Homeware guide snaps bricks onto your own baseplate */
(function () {
  var h = '', Pl = proj(255, 232, 13), Pr = proj(900, 226, 19);
  h += '<rect x="40" y="36" width="540" height="476" rx="14" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.5"/>';
  h += '<rect x="620" y="36" width="540" height="476" rx="14" fill="var(--mintbg)" stroke="var(--edge)" stroke-width="1.5"/>';
  h += H(70, 90, 'The default installer', 26) + T(70, 118, 'machine scope, asks for admin', 16, { fill: 'var(--muted)' });
  h += H(650, 90, 'A Homeware guide', 26) + T(650, 118, 'user scope, standard user', 16, { fill: 'var(--muted)' });
  h += building(Pl, 2, 0.8);
  h += bx(Pl, 3.6, 5.6, 0, 2.4, 1.4, 0.9, BR.coral, 1.3) + studs(Pl, 3.6, 5.6, 0.9, 2.4, 1.4, BR.coral, 1.3);
  var a = Pl(4.8, 5.6, 1.3), b = Pl(2.8, 4.2, 3.2);
  h += dots('M' + a[0].toFixed(0) + ' ' + a[1].toFixed(0) + ' Q' + (a[0] - 10) + ' ' + (b[1] + 10) + ' ' + b[0].toFixed(0) + ' ' + b[1].toFixed(0), 2.6);
  h += baseplate(Pr, 0, 0, 6, 4, 1.3);
  h += bx(Pr, 0.7, 0.9, 0.55, 2.2, 1.4, 0.8, BR.coral, 1.3) + studs(Pr, 0.7, 0.9, 1.35, 2.2, 1.4, BR.coral, 1.3);
  h += bx(Pr, 3.4, 1.0, 0.55, 1.6, 1.2, 0.8, BR.violet, 1.3) + studs(Pr, 3.4, 1.0, 1.35, 1.6, 1.2, BR.violet, 1.3);
  h += '<path d="M586 276 l16 14 -16 14" fill="none" stroke="var(--edge)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
  var row = function (x, y, c, lines, sub) {
    var s = fb(x, y, 38, 24, FLAT[c], { n: 1, sw: 1.3 });
    lines.forEach(function (l, i) { s += T(x + 58, y + 19 + i * 24, l, 19, {}); });
    if (sub) s += T(x + 58, y + 19 + lines.length * 24, sub, 16, { fill: 'var(--muted)' });
    return s;
  };
  h += row(70, 322, 'coral', ['Raises a UAC prompt']);
  h += row(70, 376, 'coral', ['Writes to C:\\Program Files']);
  h += row(70, 430, 'coral', ['A standard user cannot', 'approve it']);
  h += row(650, 322, 'mint', ['No UAC prompt']);
  h += row(650, 376, 'mint', ['Nothing written to C:\\Program Files,', 'C:\\Windows or HKEY_LOCAL_MACHINE']);
  h += row(650, 442, 'mint', ['Everything lives in the user profile'], '%LOCALAPPDATA%\\Programs\\<App>');
  mount('g-problem', h);
})();

/* guide: every guide is the same row of bricks, in order */
(function () {
  var h = '', cols = ['violet', 'coral', 'lemon', 'mint', 'violet', 'mint', 'coral', 'lemon', 'violet', 'coral'];
  var names = [['Summary', 'table'], ['Why the default', 'installer needs', 'admin'], ['Rejected', 'approaches'], ['Prerequisites'], ['Install'], ['Integrate'], ['Verify'], ['Use'], ['Uninstall'], ['Troubleshooting']];
  h += H(48, 64, 'Every guide follows one template', 28) + T(48, 96, 'templates/guide-template.md becomes guides/<topic>/<tool-name>/README.md', 17, { fill: 'var(--muted)' });
  for (var i = 0; i < 10; i++) {
    var r = Math.floor(i / 5), c = i % 5, x = 48 + c * 224, y = 152 + r * 180;
    h += fb(x, y, 208, 120, FLAT[cols[i]], { n: 3 });
    h += '<g transform="translate(' + (x + 26) + ' ' + (y + 26) + ')"><circle r="14" fill="' + ONBRICK + '"/><text y="6" text-anchor="middle" font-family="DM Mono" font-size="' + (i > 8 ? 14 : 17) + '" font-weight="500" fill="#fff">' + (i + 1) + '</text></g>';
    names[i].forEach(function (l, k) { h += tx(x + 104, y + 78 + k * 22 - (names[i].length - 1) * 8, l, 17, 500).replace('<text ', '<text text-anchor="middle" ').replace(' text-anchor="start"', ''); });
    if (c < 4) h += '<path d="M' + (x + 211) + ' ' + (y + 50) + ' l5 10 -5 10" fill="none" stroke="var(--edge)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  h += dots('M1152 274 V298 H152 V312', 3) + '<path d="M144 306 L152 316 L160 306" fill="none" stroke="var(--edge)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  mount('g-guide', h);
})();

/* integrate: one app folder on your own baseplate, wired to Windows with four small steps */
(function () {
  var h = '', P = proj(228, 262, 21);
  h += H(48, 64, 'Integrate without admin', 28) + T(48, 96, 'the app folder stays in the user profile; Windows is told where it is', 17, { fill: 'var(--muted)' });
  h += '<rect x="48" y="130" width="360" height="360" rx="14" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.5"/>';
  h += baseplate(P, 0, 0, 5, 3.6, 1.3) + bx(P, 0.8, 0.8, 0.55, 2.2, 1.4, 1.0, BR.coral, 1.3) + studs(P, 0.8, 0.8, 1.55, 2.2, 1.4, BR.coral, 1.3);
  h += bx(P, 3.3, 1.2, 0.55, 1.2, 1.2, 0.7, BR.lemon, 1.3) + studs(P, 3.3, 1.2, 1.25, 1.2, 1.2, BR.lemon, 1.3);
  h += H(76, 398, 'App folder', 24) + T(76, 430, '%LOCALAPPDATA%\\', 19, {}) + T(76, 456, 'Programs\\<App>', 19, {});
  var rows = [['violet', 'User PATH', 'Add the folder to HKCU\\Environment, skipping duplicates'], ['coral', 'Start Menu shortcut', '%APPDATA%\\Microsoft\\Windows\\Start Menu\\Programs\\<App>.lnk'], ['lemon', 'Refresh PATH in this terminal', 'Read the user and the machine PATH again'], ['mint', 'File associations, context menu', 'HKCU\\Software\\Classes, only what applies']];
  h += dots('M408 310 H438 M438 168 V436 M438 168 H468 M438 260 H468 M438 352 H468 M438 436 H468', 3);
  rows.forEach(function (r, i) {
    var y = 130 + i * 92 + 14;
    h += fb(470, y, 680, 72, FLAT[r[0]], { n: 6, dash: i === 3 });
    h += '<g transform="translate(504 ' + (y + 36) + ')"><circle r="16" fill="' + ONBRICK + '"/><text y="7" text-anchor="middle" font-family="DM Mono" font-size="19" font-weight="500" fill="#fff">' + (i < 3 ? i + 1 : '+') + '</text></g>';
    h += tx(540, y + 31, r[1], 21, 500) + T(540, y + 56, r[2], 15, { fill: ONBRICK });
  });
  mount('g-integrate', h);
})();

/* contribute: four steps climb like a staircase to a finished guide folder */
(function () {
  var h = '', steps = [['coral', 'Copy the template', 'templates/guide-template.md to guides/<topic>/<tool-name>/README.md'], ['lemon', 'Fill in every section', 'English, instructional tense; scripts go next to the guide'], ['mint', 'Add a row to the Guides table', 'In README.md, sorted by tool name'], ['violet', 'Scan before every commit', 'trivy fs --scanners secret .']];
  h += H(48, 64, 'Add a guide', 28) + T(48, 96, 'the short path; CONTRIBUTING.md has the full checklist', 17, { fill: 'var(--muted)' });
  steps.forEach(function (s, i) {
    var x = 48 + i * 22, y = 140 + i * 88;
    h += fb(x, y, 730, 72, FLAT[s[0]], { n: 6 });
    h += '<g transform="translate(' + (x + 34) + ' ' + (y + 36) + ')"><circle r="16" fill="' + ONBRICK + '"/><text y="7" text-anchor="middle" font-family="DM Mono" font-size="19" font-weight="500" fill="#fff">' + (i + 1) + '</text></g>';
    h += tx(x + 68, y + 31, s[1], 21, 500) + T(x + 68, y + 56, s[2], 15, { fill: ONBRICK });
  });
  h += '<path d="M810 200 l22 14 -22 14" fill="none" stroke="var(--edge)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
  h += fb(880, 140, 272, 336, FLAT.mint, { n: 4 });
  h += H(906, 186, 'The result', 22, { fill: ONBRICK });
  [['guides/', 0], ['<topic>/', 1], ['<tool-name>/', 2], ['README.md', 3], ['*.ps1', 3]].forEach(function (l, i) { h += tx(906 + l[1] * 16, 230 + i * 28, l[0], 18, 500); });
  h += T(906, 400, 'helper scripts, if the', 15, { fill: ONBRICK }) + T(906, 422, 'guide has any', 15, { fill: ONBRICK });
  h += fb(48, 520, 1104, 76, FLAT.lemon, { n: 10 });
  h += tx(84, 552, 'Only include steps you actually ran as a standard user.', 18, 500) + tx(84, 578, 'If a step is taken from vendor docs and not tested, say so in the guide.', 18, 500);
  mount('g-contribute', h);
})();
</script>
</body>
</html>
