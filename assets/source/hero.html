<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homeware hero</title>
<!-- Source of ../readme/hero.webp, hero-dark.webp (still), hero.gif, hero-dark.gif (moving) and banner-social.png, banner-social-dark.png. Render from the repo root with:
     uvx --from playwright --with pillow python -I <skill-dir>/scripts/render.py assets/source/hero.html --root assets --items hero,banner-social --out assets/readme
     Moving banner (the bricks drop onto the baseplate one by one, hold, then lift off again; nothing rotates):
     uvx --from playwright --with pillow python -I <frontdoor-readme-skill-dir>/scripts/animate.py assets/source/hero.html --root assets --item hero --call "drawBanner({v})" --name hero --amp 1 --frames 120 --fps 15 --out assets/readme
     Signature:
     1. Concept: toy bricks. The building is a grey locked block you cannot change; your room is a baseplate where chunky bricks snap on.
     2. Shape language: flat isometric solids with a heavy ink outline, three face tones per brick, round studs, dotted drop paths, ink number discs, no gradients, no glow, no characters.
     3. Typeface: Syne ExtraBold for titles and button labels, DM Mono for everything else.
     4. Palette logic: sky-blue ground by day and navy by night, grey for the building, mint for your own baseplate, coral, violet, lemon and green for the bricks you add; saturated flat colors keep the same read in both themes.
     5. Presentation: one brick scene per picture, short mono captions, titles in the wide display face; bricks are the UI too (cards, steps and buttons are bricks with studs).
     6. Not: no halftone or texture, no glass or gloss, no stock icon sets, no cream paper, no mascot. -->
<script src="shared.js"></script>
<script src="bricks.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
#hero .t { top: 136px; }
#hero .t h1 { font-size: 59px; }
#hero .t p { font-size: 18px; max-width: none; white-space: nowrap; }
.item.soc { width: 640px; height: 320px; }
.soc .t { left: 40px; top: 0; height: 320px; display: flex; align-items: center; }
.soc .t h1 { font-size: 60px; line-height: 0.95; letter-spacing: -2px; }
</style>
</head>
<body>
<div class="sheet">
<div class="item" id="hero">
  <div class="t"><h1>Homeware</h1><p>Make yourself at home on a locked-down machine.<br>Furnish your own room; leave the building to IT.</p></div>
  <svg viewBox="0 0 1200 400"><g id="scene"></g></svg>
</div>
<div class="item soc" id="banner-social" data-social>
  <div class="t"><h1>Home<br>ware</h1></div>
  <svg viewBox="0 0 640 320"><g id="scene-social"></g></svg>
</div>
</div>
<script>
/* Every brick of the furnished room: footprint, height, colour and the part of the loop in which it drops in. key marks the three numbered steps. */
var PL = [
  { x: 4.8, y: 8.0, z: 0.55, w: 3.0, d: 2.2, h: 0.25, c: 'violet', flat: 1, a: 0.00, b: 0.14 },
  { x: 1.0, y: 5.4, z: 0.55, w: 3.2, d: 2.2, h: 1.3, c: 'coral', a: 0.10, b: 0.28 },
  { x: 1.7, y: 5.9, z: 1.85, w: 1.8, d: 1.2, h: 0.9, c: 'violet', a: 0.28, b: 0.44 },
  { x: 5.4, y: 5.0, z: 0.55, w: 3.6, d: 1.0, h: 1.0, c: 'lemon', a: 0.40, b: 0.56 },
  { x: 5.8, y: 5.2, z: 1.55, w: 0.6, d: 0.6, h: 0.6, c: 'coral', a: 0.54, b: 0.64 },
  { x: 6.7, y: 5.2, z: 1.55, w: 0.6, d: 0.6, h: 0.9, c: 'violet', a: 0.58, b: 0.68 },
  { x: 2.2, y: 8.2, z: 0.55, w: 1.5, d: 0.4, h: 1.9, c: 'violet', a: 0.50, b: 0.64 },
  { x: 2.2, y: 8.6, z: 0.55, w: 1.5, d: 1.1, h: 0.7, c: 'violet', a: 0.50, b: 0.64 },
  { x: 9.4, y: 5.0, z: 0.55, w: 0.7, d: 0.7, h: 2.3, c: 'coral', a: 0.60, b: 0.74 },
  { x: 9.1, y: 4.7, z: 2.85, w: 1.3, d: 1.3, h: 0.5, c: 'lemon', a: 0.66, b: 0.80 },
  { x: 8.4, y: 7.4, z: 0.55, w: 1.2, d: 1.2, h: 0.8, c: 'coral', a: 0.68, b: 0.82 },
  { x: 8.2, y: 7.2, z: 1.35, w: 1.6, d: 1.6, h: 0.7, c: 'green', a: 0.72, b: 0.86 },
  { x: 8.5, y: 7.5, z: 2.05, w: 1.0, d: 1.0, h: 0.6, c: 'green', a: 0.76, b: 0.88 },
  { x: 0.8, y: 10.2, z: 0.55, w: 1.0, d: 1.0, h: 0.6, c: 'coral', a: 0.78, b: 0.90 },
  { x: 9.0, y: 9.8, z: 0.55, w: 1.0, d: 1.0, h: 0.6, c: 'lemon', a: 0.80, b: 0.92 },
  { x: 10.0, y: 10.3, z: 0.55, w: 0.9, d: 0.9, h: 0.9, c: 'violet', a: 0.82, b: 0.94 }
];
var KEYS = [{ i: 1, n: 1, at: [0.8, 7.9, 0.9] }, { i: 2, n: 2, at: [3.8, 6.5, 2.8] }, { i: 3, n: 3, at: [5.1, 6.3, 1.0] }];
PL.forEach(function (q, k) { q.k = (q.x + q.w / 2) + (q.y + q.d / 2) + q.z * 0.01 + k * 0.00001; });
var ORDER = PL.slice().sort(function (a, b) { return a.k - b.k; });

/* p: 0 is flat-packed (every brick lifted off), 1 is built (every brick seated) */
function scene(P, p, o) {
  var k = o.k, sw = o.sw, h = '';
  h += building(o.PB || P, sw, o.kb || k);
  h += baseplate(P, 0, 4.4, 11, 7, sw);
  [PL[1], PL[2], PL[3]].forEach(function (q) { var w = ease(win(p, q.a, q.b)); h += ghost(P, q.x, q.y, q.z, q.w, q.d, sw * 0.8).replace('/>', ' opacity="' + (0.8 * (1 - w)).toFixed(2) + '"/>'); });
  ORDER.forEach(function (q) {
    var w = ease(win(p, q.a, q.b)), dz = 6.2 * (1 - w), c = BR[q.c];
    h += '<g opacity="' + Math.min(1, w * 4).toFixed(2) + '">' + bx(P, q.x, q.y, q.z + dz, q.w, q.d, q.h, c, sw) + (q.flat ? '' : studs(P, q.x, q.y, q.z + q.h + dz, q.w, q.d, c, sw)) + '</g>';
  });
  var pw = ease(win(p, PL[2].a, PL[2].b));
  if (pw < 0.97) { var a = P(2.6, 6.5, 2.8 + 6.2 * (1 - pw)), b = P(2.6, 6.5, 9); h += '<path d="M' + a[0].toFixed(1) + ' ' + a[1].toFixed(1) + ' L' + b[0].toFixed(1) + ' ' + b[1].toFixed(1) + '" stroke="var(--edge)" stroke-width="' + (sw * 1.2) + '" stroke-dasharray="1 8" stroke-linecap="round" fill="none"/>'; }
  [PL[1], PL[2], PL[3]].forEach(function (q, i) { h += discI(P, KEYS[i].at[0], KEYS[i].at[1], KEYS[i].at[2], KEYS[i].n, win(ease(win(p, q.a, q.b)), 0.97, 1), k); });
  if (o.label) {
    var lw = ease(win(p, 0.88, 0.98)), x0 = 0.5, y0 = 11.9, zt = 0.3, o0 = P(x0, y0, zt + 5 * (1 - lw)), u = P.u;
    h += '<g opacity="' + Math.min(1, lw * 4).toFixed(2) + '">' + bx(P, x0, y0, 5 * (1 - lw), 5.6, 1.0, zt, BR.lemon, sw);
    h += '<g transform="matrix(' + (0.866 * u).toFixed(2) + ' ' + (0.5 * u).toFixed(2) + ' ' + (-0.866 * u).toFixed(2) + ' ' + (0.5 * u).toFixed(2) + ' ' + o0[0].toFixed(1) + ' ' + o0[1].toFixed(1) + ')"><text x="0.22" y="0.68" font-family="DM Mono" font-size="0.62" font-weight="500" fill="#0d2342">%LOCALAPPDATA%</text></g></g>';
  }
  return h;
}

var PH = proj(880, 92, 24), PHB = proj(1065, 200, 17);
// v runs -1..1 on a slow sine; clamping gives a rest at each end (all bricks off, then all seated)
function drawBanner(v) {
  var p = Math.min(1, Math.max(0, (((v + 1) / 2) - 0.12) / 0.76));
  mount('scene', scene(PH, p, { k: 1.1, sw: 1.6, label: true, PB: PHB, kb: 0.85 }) + '<rect x="1.5" y="1.5" width="1197" height="397" rx="16" fill="none" stroke="var(--cardline)" stroke-width="3"/>');
}
mount('scene', scene(PH, 1, { k: 1.1, sw: 1.6, label: true, PB: PHB, kb: 0.85 }));
mount('scene-social', scene(proj(470, 104, 13.5), 1, { k: 0.6, sw: 1.2, label: false, PB: proj(585, 166, 8.5), kb: 0.5 }));
</script>
</body>
</html>
