<!doctype html>
<html lang="en">
<head>

<title>Homeware ground rules</title>

<body>
<div class="sheet">
<div class="item" id="rules" style="height:450px">
  <svg viewBox="0 0 1200 450" fill="none" stroke="var(--line)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <defs>
      <clipPath id="room"><rect x="600" y="112" width="560" height="298"/></clipPath>
      <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></radialGradient>
      <g id="lock"><rect x="-13" y="-4" width="26" height="22" rx="2" fill="var(--accent)" stroke="none"/><path d="M-8 -4 v-8 a8 8 0 0 1 16 0 v8" stroke="var(--accent)" stroke-width="3.2"/></g>
    </defs>
    <text x="64" y="58" font-family="DM Serif Display" font-size="36" fill="var(--ink)" stroke="none">The building</text>
    <text x="64" y="90" font-family="IBM Plex Mono" font-size="17" fill="var(--muted)" stroke="none">machine scope: needs admin, ask IT</text>
    <text x="640" y="58" font-family="DM Serif Display" font-size="36" fill="var(--ink)" stroke="none">Your room</text>
    <text x="640" y="90" font-family="IBM Plex Mono" font-size="17" fill="var(--muted)" stroke="none">user profile: standard user</text>
    <rect x="40" y="112" width="1120" height="298" fill="var(--soft)"/>
    <g data-bleed clip-path="url(#room)"><rect x="600" y="112" width="560" height="298" fill="var(--paper)" stroke="none"/><circle cx="1040" cy="150" r="190" fill="url(#lamp)" stroke="none"/></g>
    <rect x="40" y="112" width="1120" height="298"/>
    <path d="M40 211 H600 M40 310 H600"/>
    <path d="M600 112 V410" stroke-width="4"/>
    <rect x="600" y="112" width="560" height="298" stroke="var(--accent)" stroke-width="4"/>
    <g font-family="IBM Plex Mono" font-size="24" font-weight="600" fill="var(--ink)" stroke="none">
      <text x="72" y="172">C:\Program Files</text>
      <text x="72" y="271">C:\Windows</text>
      <text x="72" y="370">HKEY_LOCAL_MACHINE</text>
    </g>
    <use href="#lock" x="540" y="154"/><use href="#lock" x="540" y="253"/><use href="#lock" x="540" y="352"/>
    <g fill="var(--accent)" stroke="none"><circle cx="648" cy="168" r="7"/><circle cx="648" cy="231" r="7"/><circle cx="648" cy="294" r="7"/><circle cx="648" cy="357" r="7"/></g>

      <text x="676" y="239">%APPDATA%</text>
      <text x="676" y="302">%USERPROFILE%</text>
      <text x="676" y="365">HKEY_CURRENT_USER</text>
    </g>
    <path d="M660 192 H1120 M660 255 H1120 M660 318 H1120" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="2 7" opacity=".5"/>
