<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homeware ground rules</title>
<!-- Source of ../readme/rules.webp and ../readme/rules-dark.webp. Render from the repo root with:
     uvx --from playwright --with pillow python -I <skill-dir>/scripts/render.py assets/source/rules.html --root assets --out assets/readme
     Signature: see hero.html (toy bricks, sky-blue ground, Syne and DM Mono). Every label comes from the Ground rules text of the README. -->
<script src="shared.js"></script>
<script src="bricks.js"></script>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="sheet">
<div class="item" id="rules" style="height:500px"><svg viewBox="0 0 1200 500" id="g-rules"></svg></div>
</div>
<script>
var h = '', i;
h += H(48, 66, 'The building', 30) + T(48, 96, 'machine scope: needs admin, ask IT', 17, { fill: 'var(--muted)' });
h += H(640, 66, 'Your room', 30) + T(640, 96, 'user profile: standard user', 17, { fill: 'var(--muted)' });
['C:\\Program Files', 'C:\\Windows', 'HKEY_LOCAL_MACHINE'].forEach(function (s, k) {
  var x = 48 + (k === 1 ? 40 : 0), y = 150 + k * 100;
  h += fb(x, y, 480, 84, 'var(--gl)', { n: 6 });
  h += T(x + 28, y + 51, s, 22, {}) + LOCK(x + 440, y + 30, 1.1);
});
h += fb(640, 140, 512, 330, FLAT.mint, { n: 7 });
[['coral', '%LOCALAPPDATA%'], ['violet', '%APPDATA%'], ['lemon', '%USERPROFILE%'], ['white', 'HKEY_CURRENT_USER']].forEach(function (r, k) {
  var y = 184 + k * 70;
  h += fb(668, y, 456, 54, FLAT[r[0]], { n: 5 });
  h += T(696, y + 35, r[1], 22, { fill: ONBRICK });
});
mount('g-rules', h);
</script>
</body>
</html>
